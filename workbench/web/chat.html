<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuantuMania ? Chat Preview</title><link rel="stylesheet" href="/chat.css"></head><body>
<canvas id="network-background" aria-hidden="true"></canvas>
<div id="app-shell" inert><header class="topbar"><button id="sidebar-toggle" class="icon-button" aria-label="Open sidebar" aria-expanded="false"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg></button><button id="agent-status" class="gold-button">&#10022; &nbsp; Research</button></header>
<button id="sidebar-backdrop" aria-label="Close navigation" hidden></button><aside id="sidebar" class="workspace-rail" hidden><div class="sidebar-brand">&#10022; QUANTUMANIA <button id="sidebar-close" aria-label="Close sidebar">&times;</button></div><button id="new-chat" class="rail-item">&#10022; New conversation</button><button id="history-button" class="rail-item">&#10022; Conversations</button><button id="overview-tab" class="rail-item">&#10022; Overview</button><a href="/workbench" class="rail-item">&#10022; Research workbench</a><button id="status-button" class="rail-item">&#10022; Model status</button><button id="settings-button" class="rail-item">&#10022; Settings</button><button id="notification-button" class="rail-item">&#10022; Notifications</button><button id="profile-button" class="rail-item">&#10022; Workspace</button><button id="avatar-button" class="rail-item">W &middot; Waiz</button><button id="theme-button" class="rail-item">Appearance</button><button id="voice-mode-button" class="rail-item">Voice assistant</button><button id="replay-intro" class="rail-item">Replay intro</button><section class="recent" id="recent"><label for="history-search">Conversations</label><input id="history-search" placeholder="Search conversations..."><div id="history-list"></div><button id="see-more">See More &darr;</button></section></aside>
<main class="stage"><section class="welcome" id="welcome"><div class="orb-space"><button id="orb-button" class="orb-button" aria-label="About the research assistant"><canvas id="orb-particles" aria-hidden="true"></canvas></button></div><div class="intro"><h1 class="greeting">Good to See You!</h1><h2>How Can I <em>Help</em> You Today?</h2></div></section>
<div id="chat-orb" hidden><canvas id="chat-orb-canvas" aria-hidden="true"></canvas></div><section id="conversation" class="conversation" aria-label="Conversation" aria-live="polite" hidden></section>
<div class="composer"><div class="composer-inner"><div class="model-line"><button id="mode-info">&#10022; &nbsp; Crypto Research / Evidence Search</button><span class="model-status"><i></i> Local</span></div><form id="chat-form"><div class="input-line"><button type="button" id="source-button" class="plus-button" aria-label="Choose a PDF source">+</button><label for="message" class="sr-only">Ask a research question</label><textarea id="message" rows="1" required maxlength="500" placeholder="Ask anything &hellip; or /image &lt;prompt&gt;"></textarea><button type="button" id="voice-button" class="composer-icon" aria-label="Voice availability"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg></button><button type="button" id="lens-button" class="composer-icon" aria-label="QuantuMania Lens"><svg viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/></svg></button><button id="send" class="send-button" aria-label="Send message">&uarr;</button></div><div id="source-picker" hidden><label for="scope">Scope</label><select id="scope"><option value="general">General knowledge</option><option value="source_specific">Selected PDF</option></select><label for="source">Source</label><select id="source"><option value="">Choose a document</option></select></div></form></div></div>
<div class="ideas" id="suggestions"><button data-prompt="How does position sizing help manage risk?">&#10022; &nbsp; Any advice for me?</button><button data-prompt="Some youtube video idea">&#10022; &nbsp; Some youtube video idea</button><button data-prompt="Life lessons from history">&#10022; &nbsp; Life lessons from history</button><button id="more-button" aria-label="More research tools">&bull;&bull;&bull;</button></div><div class="chat-controls"><button id="back-button" hidden>&larr; Back to welcome</button><button id="chat-tab" hidden>New chat</button></div></main>
<footer>Unlock new era with QuantuMania. <button id="footer-settings">make it yours</button><small>Reviewed PDF search &middot; Model evaluation in progress</small></footer>
<dialog id="details"><div class="dialog-heading"><h2 id="dialog-title">Workspace</h2><button id="close-dialog" aria-label="Close dialog">&times;</button></div><div id="dialog-body"></div></dialog><div id="toast" role="status" hidden></div></div><section id="startup" aria-label="Welcome to Crypto Research"><div class="startup-grid"></div><div class="startup-glow"></div><button id="begin-intro" aria-label="Tap to begin"><div class="startup-orb"><i></i><i></i><i></i><i></i><canvas id="intro-orb" aria-hidden="true"></canvas></div><div class="tap-label">TAP TO BEGIN<small>WITH SOUND EXPERIENCE</small></div><div class="startup-sequence"><h1>QUANTUMANIA</h1><div class="startup-lines"><i></i><i></i></div><p class="startup-subtitle">AI CHAT INTERFACE</p><div class="startup-checks"><div><span>CHAT INTERFACE</span><b>READY</b></div><div><span>PDF LIBRARY</span><b>LOCAL</b></div><div><span>LIVE AGENTS</span><b>NOT CONNECTED</b></div><div><span>MODEL STATUS</span><b>EVALUATING</b></div></div><p class="startup-caption"><span class="loading-dots"><i></i><i></i><i></i></span> INITIALIZING QUANTUM ENGINE</p></div></button><button id="intro-sound" aria-pressed="false">Sound on</button><button id="skip-intro">Skip intro →</button></section>
<script src="/chat.js"></script><script src="/visuals.js" type="module"></script></body></html>
